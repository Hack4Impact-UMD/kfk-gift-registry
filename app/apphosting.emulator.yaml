env:
  # App Hosting's emulator only builds FIREBASE_CONFIG (which the admin SDK
  # needs for the default storage bucket) by looking up the backend with the
  # CLI's credentials, which CI doesn't have.
  - variable: FIREBASE_CONFIG
    value: '{"projectId":"kfk-gift-registry","storageBucket":"kfk-gift-registry.firebasestorage.app"}'
