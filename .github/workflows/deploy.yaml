name: Deploy to Firebase

env:
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/credentials
  # One release name for the app and functions; Sentry release names are org-global.
  SENTRY_RELEASE: kfk-gift-registry@${{ github.sha }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sentry needs history to associate commits with the release.
          fetch-depth: 0

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCT_KFK }}' > /tmp/credentials

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.8.0 isolate-package get-or-throw@2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write apphosting.yaml
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          RECAPTCHA_ENTERPRISE_KEY: ${{ secrets.RECAPTCHA_ENTERPRISE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cat > apphosting.yaml << HEREDOC
          runConfig:
            minInstances: 0
          scripts:
            runCommand: node app/.output/server/index.mjs
          env:
            - variable: GOOGLE_BUILDABLE
              value: app
              availability:
                - BUILD
            # The app build needs ~2.5GB of heap; the worker's default is lower.
            - variable: NODE_OPTIONS
              value: "--max-old-space-size=3072"
              availability:
                - BUILD
            - variable: VITE_FIREBASE_API_KEY
              value: "$FIREBASE_API_KEY"
              availability:
                - BUILD
                - RUNTIME
            - variable: VITE_RECAPTCHA_ENTERPRISE_KEY
              value: "$RECAPTCHA_ENTERPRISE_KEY"
              availability:
                - BUILD
                - RUNTIME
            - variable: RESEND_API_KEY
              value: "$RESEND_API_KEY"
              availability:
                - RUNTIME
            - variable: APP_BASE_URL
              value: "$APP_BASE_URL"
              availability:
                - BUILD
                - RUNTIME
            - variable: SENTRY_AUTH_TOKEN
              value: "$SENTRY_AUTH_TOKEN"
              availability:
                - BUILD
            - variable: SENTRY_RELEASE
              value: "$SENTRY_RELEASE"
              availability:
                - BUILD
          HEREDOC

      - name: Deploy
        env:
          # Written to functions/isolate/.env by the functions predeploy hook in firebase.json.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: firebase deploy

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: hack4impact-umd
        with:
          release: ${{ env.SENTRY_RELEASE }}
          projects: kfk-gift-registry-app kfk-gift-registry-functions
          environment: production
          # Squash merges rewrite history between releases.
          ignore_missing: true
